# Source of truth for PianoDeeply.xcodeproj. After adding or removing files,
# regenerate with `xcodegen generate` (brew install xcodegen). The generated
# project is committed so the app opens without XcodeGen.
name: PianoDeeply
options:
  bundleIdPrefix: com.eli.pianodeeply
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  PianoCore:
    path: PianoCore
targets:
  PianoDeeply:
    type: application
    platform: iOS
    sources:
      - path: PianoDeeply
    dependencies:
      - package: PianoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eli.pianodeeply
        PRODUCT_NAME: Piano Deeply
        INFOPLIST_FILE: PianoDeeply/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Piano, Deeply"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Piano, Deeply records only when you tap Record, so you can listen back to your own playing. Recordings stay on this iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  PianoDeeplyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PianoDeeplyTests
    dependencies:
      - target: PianoDeeply
      - package: PianoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.eli.pianodeeply.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Piano Deeply.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Piano Deeply"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PianoDeeply:
    build:
      targets:
        PianoDeeply: all
        PianoDeeplyTests: [test]
    test:
      targets:
        - PianoDeeplyTests
        - package: PianoCore/PianoCoreTests
