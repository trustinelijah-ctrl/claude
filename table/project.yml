name: Table
options:
  bundleIdPrefix: app.table
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - Table.storekit
packages:
  ChessCore:
    path: ChessCore
targets:
  Table:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: ChessCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TABLE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIAppFonts:
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
          - CormorantGaramond-MediumItalic.ttf
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: TABLE
        PRODUCT_BUNDLE_IDENTIFIER: app.table.chess
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  TableUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Table
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.table.chess.uitests
        TEST_TARGET_NAME: Table
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Table:
    build:
      targets:
        Table: all
    run:
      config: Debug
      storeKitConfiguration: Table.storekit
    test:
      config: Debug
      targets:
        - TableUITests
    archive:
      config: Release
