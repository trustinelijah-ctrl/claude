# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Logos
options:
  bundleIdPrefix: school.logos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Logos:
    type: application
    platform: iOS
    sources:
      - path: Logos
      # The one content corpus, shared with the web app. Regenerate with
      # `npm run corpus` in logos/ after editing web/index.html.
      - path: ../content/corpus.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: school.logos.app
        PRODUCT_NAME: LOGOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Logos/Info.plist
      properties:
        CFBundleDisplayName: LOGOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Vellum
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        NSMicrophoneUsageDescription: LOGOS listens while you practise saying an idea aloud, so it can write down what you said. Nothing is recorded or kept.
        NSSpeechRecognitionUsageDescription: Your spoken answers are turned into text on this device so you can check and be coached on your words.
        CFBundleURLTypes:
          - CFBundleURLName: school.logos.app
            CFBundleURLSchemes: [logos]
        CFBundleLocalizations: [en, de]
        CFBundleDevelopmentRegion: en
schemes:
  Logos:
    build:
      targets:
        Logos: all
    run:
      config: Debug
    archive:
      config: Release
