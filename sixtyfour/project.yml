name: SixtyFour
options:
  bundleIdPrefix: app.sixtyfour
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
fileGroups:
  - SixtyFour.storekit
packages:
  ChessCore:
    path: ChessCore
targets:
  SixtyFour:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: ChessCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "64"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone: portrait only; the board takes the width and the players sit at either end.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: SixtyFour
        PRODUCT_BUNDLE_IDENTIFIER: app.sixtyfour.chess
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  SixtyFourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SixtyFour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sixtyfour.chess.uitests
        TEST_TARGET_NAME: SixtyFour
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SixtyFour:
    build:
      targets:
        SixtyFour: all
    run:
      config: Debug
      storeKitConfiguration: SixtyFour.storekit
    test:
      config: Debug
      targets:
        - SixtyFourUITests
    archive:
      config: Release
