name: 64

on:
  push:
    paths: ["sixtyfour/**", ".github/workflows/sixtyfour.yml"]
  pull_request:
    paths: ["sixtyfour/**", ".github/workflows/sixtyfour.yml"]
  workflow_dispatch:

concurrency:
  group: sixtyfour-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    name: Build, test, screenshots
    # arm64 macOS runners are often out of capacity; the Intel image has the same Xcode.
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults: { run: { working-directory: sixtyfour } }
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version && xcrun simctl list devicetypes | grep -i ipad

      - name: Chess rules tests
        working-directory: sixtyfour/ChessCore
        run: |
          swift test > test.log 2>&1 || true
          tail -8 test.log
          # Fail the step (and show which test) on any failure; a plain tail hid them before.
          if grep -qE "with [1-9][0-9]* failures?" test.log; then grep -E "error:|failed" test.log | head -20; exit 1; fi

      - name: Project is up to date with project.yml
        run: |
          brew install xcodegen >/dev/null
          cp -R SixtyFour.xcodeproj /tmp/committed.xcodeproj 2>/dev/null || true
          xcodegen generate
          diff -r -q /tmp/committed.xcodeproj SixtyFour.xcodeproj -x xcuserdata -x '*.xcworkspace' || echo "::warning::Committed SixtyFour.xcodeproj differs from project.yml output"

      - name: Build for testing
        run: |
          xcodebuild -project SixtyFour.xcodeproj -scheme SixtyFour -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -150; tail -60 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v -E "appintents|Metadata extraction" | sort -u | head -80 || true
          tail -3 build.log

      - name: Pick simulators
        run: |
          cat > /tmp/pick.py <<'PY'
          import json, sys
          prefix = sys.argv[1]
          d = json.load(sys.stdin)['devices']
          for k, v in sorted(d.items(), reverse=True):
              if 'iOS' not in k:
                  continue
              for x in v:
                  if x['name'].startswith(prefix):
                      print(x['udid'])
                      sys.exit(0)
          PY
          pick() { xcrun simctl list devices available -j | python3 /tmp/pick.py "$1"; }
          echo "MINI=$(pick 'iPad mini')" >> $GITHUB_ENV
          echo "PRO13=$(pick 'iPad Pro 13')" >> $GITHUB_ENV
          echo "AIR11=$(pick 'iPad Air 11')" >> $GITHUB_ENV
          xcrun simctl list devices available | grep -i ipad

      - name: Screenshots
        if: always() && !contains(github.event.head_commit.message, '[ui-only]')
        run: |
          cat > /tmp/collect.py <<'PY'
          import json, os, shutil, sys
          dev = sys.argv[1]
          src = f"export/{dev}"
          try:
              manifest = json.load(open(os.path.join(src, "manifest.json")))
          except Exception as e:
              print("no manifest", e)
              sys.exit(0)
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_0_")[0]
                  shutil.copy(os.path.join(src, a["exportedFileName"]), f"shots/{dev.lower()}-{name}.png")
          PY
          mkdir -p shots
          for dev in PRO13; do
            udid="${!dev}"
            [ -z "$udid" ] && continue
            # Boot first: a cold simulator can kill the test runner before it starts.
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b > /dev/null 2>&1 || true
            for attempt in 1 2; do
              rm -rf "results/shots-$dev.xcresult"
              xcodebuild test-without-building -project SixtyFour.xcodeproj -scheme SixtyFour -derivedDataPath build \
                -destination "id=$udid" -only-testing:SixtyFourUITests/ScreenshotTests \
                -resultBundlePath "results/shots-$dev.xcresult" > "shots-$dev.log" 2>&1 && break
              tail -20 "shots-$dev.log"
              grep -q "before starting test execution" "shots-$dev.log" || break
            done
            mkdir -p "export/$dev"
            xcrun xcresulttool export attachments --path "results/shots-$dev.xcresult" --output-path "export/$dev" || true
            python3 /tmp/collect.py "$dev"
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixtyfour-screenshots
          path: sixtyfour/shots
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-shots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d shots ] && [ "$(ls -A shots)" ] || exit 0
          cd shots
          git init -q -b ci-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA}" > README.md
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots

      - name: UI tests (interaction)
        run: |
          set -o pipefail
          status=0
          xcodebuild test-without-building -project SixtyFour.xcodeproj -scheme SixtyFour -derivedDataPath build \
            -destination "id=$AIR11" -only-testing:SixtyFourUITests/GameplayUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath results/ui.xcresult > ui.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|error:|XCTAssert" ui.log | head -80 || true
          grep -A3 "DIAG" ui.log | grep -v "^--$" | head -400 || true
          tail -5 ui.log
          exit $status
