name: 64

on:
  push:
    paths: ["sixtyfour/**", ".github/workflows/sixtyfour.yml"]
  pull_request:
    paths: ["sixtyfour/**", ".github/workflows/sixtyfour.yml"]
  workflow_dispatch:

concurrency:
  group: sixtyfour-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    name: Build, test, screenshots
    # Apple-silicon runners are several times faster for the simulator. If GitHub is short of
    # them and the job sits queued, macos-15-intel has the same Xcode but needs the long timeout.
    runs-on: macos-15
    timeout-minutes: 180
    defaults: { run: { working-directory: sixtyfour } }
    steps:
      - uses: actions/checkout@v4

      # App Store uploads must be built with Xcode 26 (since April 2026): use the newest on the runner.
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; else echo "::warning::No Xcode 26 on this runner"; fi
          ls -d /Applications/Xcode*.app

      - name: Toolchain
        run: xcodebuild -version && swift --version && xcrun simctl list devicetypes | grep -i ipad

      - name: Chess rules tests
        working-directory: sixtyfour/ChessCore
        run: |
          swift test > test.log 2>&1 || true
          tail -8 test.log
          # Fail the step (and show which test) on any failure; a plain tail hid them before.
          if grep -qE "with [1-9][0-9]* failures?" test.log; then grep -E "error:|failed" test.log | head -20; exit 1; fi

      - name: Project is up to date with project.yml
        run: |
          brew install xcodegen >/dev/null
          cp -R SixtyFour.xcodeproj /tmp/committed.xcodeproj 2>/dev/null || true
          xcodegen generate
          diff -r -q /tmp/committed.xcodeproj SixtyFour.xcodeproj -x xcuserdata -x '*.xcworkspace' || echo "::warning::Committed SixtyFour.xcodeproj differs from project.yml output"

      - name: Build for testing
        id: build
        run: |
          xcodebuild -project SixtyFour.xcodeproj -scheme SixtyFour -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -150; tail -60 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v -E "appintents|Metadata extraction" | sort -u | head -80 || true
          tail -3 build.log

      # The App Store build: Release, for real devices, unsigned here (signing happens on the owner's Mac).
      - name: Release build (device)
        run: |
          xcodebuild -project SixtyFour.xcodeproj -scheme SixtyFour -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO build > release.log 2>&1 \
            || { grep -E "error:" release.log | sort -u | head -80; tail -40 release.log; exit 1; }
          tail -2 release.log

      - name: Pick simulators
        run: |
          cat > /tmp/pick.py <<'PY'
          import json, sys
          prefix = sys.argv[1]
          d = json.load(sys.stdin)['devices']
          for k, v in sorted(d.items(), reverse=True):
              if 'iOS' not in k:
                  continue
              for x in v:
                  if x['name'].startswith(prefix):
                      print(x['udid'])
                      sys.exit(0)
          PY
          pick() { xcrun simctl list devices available -j | python3 /tmp/pick.py "$1"; }
          first() { for p in "$@"; do u=$(pick "$p"); [ -n "$u" ] && { echo "$u"; return; }; done; }
          echo "PHONESE=$(first 'iPhone SE' 'iPhone 13 mini' 'iPhone 16e' 'iPhone 17e')" >> $GITHUB_ENV
          echo "PHONEMAX=$(first 'iPhone 17 Pro Max' 'iPhone 16 Pro Max' 'iPhone 16 Plus' 'iPhone 15 Pro Max')" >> $GITHUB_ENV
          xcrun simctl list devices available | grep -i iphone | head -20
          echo "MINI=$(pick 'iPad mini')" >> $GITHUB_ENV
          echo "PRO13=$(pick 'iPad Pro 13')" >> $GITHUB_ENV
          echo "AIR11=$(pick 'iPad Air 11')" >> $GITHUB_ENV
          xcrun simctl list devices available | grep -i ipad

      - name: UI tests (interaction)
        if: steps.build.outcome == 'success' && !contains(github.event.head_commit.message, '[preview]') && !contains(github.event.head_commit.message, '[iphone]')
        run: |
          set -o pipefail
          status=0
          # A hard limit of 45 minutes, so a stuck test still prints what happened.
          perl -e 'alarm shift; exec @ARGV' 2700 xcodebuild test-without-building -project SixtyFour.xcodeproj -scheme SixtyFour -derivedDataPath build \
            -destination "id=$AIR11" -only-testing:SixtyFourUITests/GameplayUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath results/ui.xcresult > ui.log 2>&1 || status=$?
          grep -E "Test Case .*(passed|failed)|error:|XCTAssert" ui.log | head -80 || true
          grep -A3 "DIAG" ui.log | grep -v "^--$" | head -400 || true
          tail -5 ui.log
          exit $status

      - name: Screenshots
        if: always() && steps.build.outcome == 'success' && !contains(github.event.head_commit.message, '[ui-only]')
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cat > /tmp/collect.py <<'PY'
          import json, os, shutil, sys
          dev = sys.argv[1]
          src = f"export/{dev}"
          try:
              manifest = json.load(open(os.path.join(src, "manifest.json")))
          except Exception as e:
              print("no manifest", e)
              sys.exit(0)
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_0_")[0]
                  shutil.copy(os.path.join(src, a["exportedFileName"]), f"shots/{dev.lower()}-{name}.png")
          PY
          mkdir -p shots
          # A commit tagged [preview] shoots only the layout preview, on the 11-inch iPad Air.
          # A commit tagged [iphone] shoots only the iPhones, for a quick look at the phone layout.
          DEVS="PRO13 PHONESE"; ONLY="SixtyFourUITests/ScreenshotTests"
          if [[ "$COMMIT_MSG" == *"[preview]"* ]]; then DEVS="AIR11"; ONLY="SixtyFourUITests/ScreenshotTests/testB0LayoutPreview"; fi
          if [[ "$COMMIT_MSG" == *"[iphone]"* ]]; then DEVS="PHONESE PHONEMAX"; fi
          for dev in $DEVS; do
            udid="${!dev}"
            [ -z "$udid" ] && continue
            # Boot first: a cold simulator can kill the test runner before it starts.
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b > /dev/null 2>&1 || true
            for attempt in 1 2; do
              rm -rf "results/shots-$dev.xcresult"
              xcodebuild test-without-building -project SixtyFour.xcodeproj -scheme SixtyFour -derivedDataPath build \
                -destination "id=$udid" -only-testing:"$ONLY" \
                -resultBundlePath "results/shots-$dev.xcresult" > "shots-$dev.log" 2>&1 && break
              tail -20 "shots-$dev.log"
              grep -q "before starting test execution" "shots-$dev.log" || break
            done
            mkdir -p "export/$dev"
            xcrun xcresulttool export attachments --path "results/shots-$dev.xcresult" --output-path "export/$dev" || true
            python3 /tmp/collect.py "$dev"
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixtyfour-screenshots
          path: sixtyfour/shots
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-shots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d shots ] && [ "$(ls -A shots)" ] || exit 0
          cd shots
          git init -q -b ci-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA}" > README.md
          git add -A && git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots

